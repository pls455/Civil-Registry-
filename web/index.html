<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minhaj AI</title><style>body{font-family:system-ui;margin:0;background:#10131a;color:#eee}main{max-width:800px;margin:auto;padding:20px}h1{margin-bottom:4px}.muted{color:#9da5b4}#chat{height:65vh;overflow:auto;padding:12px}.msg{padding:12px 14px;margin:10px 0;border-radius:14px;white-space:pre-wrap}.u{background:#243047}.a{background:#191f2a}.bar{display:flex;gap:8px}input{flex:1;padding:14px;border-radius:12px;border:1px solid #333;background:#171b23;color:white}button{padding:12px 18px;border:0;border-radius:12px;cursor:pointer}</style></head><body><main><h1>منهاج AI</h1><div class="muted">ذكاء اصطناعي تعليمي محلي ومستقل</div><div id="chat"></div><div class="bar"><input id="q" placeholder="اسأل عن درس، اطلب شرحًا أو اكتب مسألة..."><button onclick="send()">إرسال</button></div></main><script>const c=document.getElementById('chat'),q=document.getElementById('q');function add(t,k){let d=document.createElement('div');d.className='msg '+k;d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight}async function send(){let x=q.value.trim();if(!x)return;q.value='';add(x,'u');try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:x})});let j=await r.json();add(j.answer||j.error,'a')}catch(e){add('تعذر الوصول للمحرك المحلي.','a')}}q.addEventListener('keydown',e=>{if(e.key==='Enter')send()});add('مرحبًا. أنا منهاج AI وأعمل محليًا بدون API.','a');</script></body></html>
